<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="icon" href="./assets/images/weather_logo.ico" sizes="any">
  </head>
  <body>
    <div class="card">
        <div class="search">
            <input type="text" placeholder="Enter City Name" spellcheck="false" class="city-input">
            <div class="search-icon"><span><i class="fa-solid fa-magnifying-glass"></i></span></div>
        </div>
        <div class="weather-details">
            <div class="weather-icon"><img src="./assets/images/clear.png" alt="clear"></div>
            <h1 class="temp">22°c</h1>
            <h2 class="city">New York</h2>
            <div class="details">
                <div class="columns" id="col-1">
                    <div class="icons" id="icon-1"><img src="./assets/images/humidity.png" alt="humidity"></div>
                    <div class="humidity">
                        <p class="humidity-details">64%</p>
                        <p>Humidity</p>
                    </div>
                </div>
                <div class="columns" id="col-2">
                    <div class="icons" id="icon-1"><img src="./assets/images/wind.png" alt="humidity"></div>
                    <div class="wind">
                        <p class="wind-details">18 km/h</p>
                        <p>Wind Speed</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
